media:
  input: content/media
  output: /media
content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    fields:
      - name: title
        type: string
      - name: date
        type: string
      - name: CoverImage
        type: image
      - name: body
        type: rich-text
  - name: pages
    label: Pages
    type: collection
    path: content
    fields:
      - name: title
        type: string
      - name: date
        type: string
      - name: body
        type: rich-text
  - name: site
    label: Site settings
    type: file
    path: content/_data/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages-cms-action.yml