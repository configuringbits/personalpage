media:
  input: content/media
  output: /media
content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: string
      - name: draft
        label: Draft
        type: boolean
      - name: cover
        label: Post Cover
        type: object
        fields:
          - name: image
            label: Image URL
            type: string
            help: "Direct link or path (e.g., https://i.ibb.co/...)"
          - name: alt
            label: Alt Text
            type: string
            help: "Description for accessibility"
          - name: caption
            label: Caption
            type: string
            help: "Text displayed under the image"
      - name: body
        type: rich-text
  - name: pages
    label: Pages
    type: collection
    path: content
    fields:
      - name: title
        type: string
      - name: date
        type: string
      - name: body
        type: rich-text
  - name: site
    label: Site settings
    type: file
    path: content/_data/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages-cms-action.yml